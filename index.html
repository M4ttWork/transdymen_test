<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Status auta</title>
<style>
:root{--bg:#f3f5f8;--card:#fff;--text:#172033;--muted:#687386;--accent:#1a73e8;--danger:#c62828;--ok:#137333}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,Arial,sans-serif;color:var(--text)}
.wrap{max-width:720px;margin:0 auto;padding:24px 14px 50px}.card{background:var(--card);border-radius:18px;padding:24px;box-shadow:0 5px 24px #00000012}
h1{margin:0 0 8px;text-align:center;font-size:28px}.sub{text-align:center;color:var(--muted);margin-bottom:24px}
label{display:block;font-weight:700;margin:0 0 8px}.field{margin-bottom:18px}
input,textarea{width:100%;padding:13px 14px;border:1px solid #d4d9e1;border-radius:11px;font:inherit;outline:0}
input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px #1a73e81a}textarea{min-height:110px;resize:vertical}
button{border:0;border-radius:11px;padding:13px 16px;font:inherit;font-weight:700;cursor:pointer}
.primary{width:100%;background:var(--accent);color:white}.secondary{background:#eef1f5;color:#263244}.danger{background:#feeceb;color:var(--danger)}
.hidden{display:none!important}.msg{padding:12px;border-radius:10px;margin-bottom:16px;font-weight:600}.err{background:#feeceb;color:var(--danger)}.ok{background:#e8f5e9;color:var(--ok)}
.searchbox{position:relative}.suggestions{position:absolute;z-index:5;left:0;right:0;top:100%;background:white;border:1px solid #ddd;border-top:0;border-radius:0 0 11px 11px;max-height:230px;overflow:auto;box-shadow:0 8px 20px #0001}.suggestion{padding:12px;border-bottom:1px solid #eee;cursor:pointer}.suggestion:hover{background:#f5f7fa}
.selected{margin-top:9px;padding:11px;border-radius:10px;background:#e8f0fe;color:#174ea6;font-weight:700}
.upload{border:2px dashed #c7ccd4;border-radius:12px;padding:20px;text-align:center;background:#fafbfc;cursor:pointer}.upload input{display:none}.count{text-align:right;color:var(--muted);font-size:13px;margin-top:7px}
.preview{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}.pic{position:relative;aspect-ratio:1;overflow:hidden;border-radius:10px;background:#eee}.pic img{width:100%;height:100%;object-fit:cover}.x{position:absolute;right:5px;top:5px;width:28px;height:28px;padding:0;border-radius:50%;background:#000b;color:#fff}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.user{color:var(--muted);font-size:14px}
.spinner{text-align:center;color:var(--muted);margin-top:12px}.bridge{position:absolute;width:1px;height:1px;left:-10000px;top:-10000px}
@media(max-width:520px){.card{padding:18px}.preview{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <div id="loginCard" class="card">
    <h1>STATUS AUTA</h1>
    <div class="sub">Logowanie pracownika</div>
    <div id="loginMsg"></div>
    <form id="loginForm">
      <div class="field"><label for="login">Login</label><input id="login" autocomplete="username" required></div>
      <div class="field"><label for="password">Hasło</label><input id="password" type="password" autocomplete="current-password" required></div>
      <button class="primary" id="loginBtn">ZALOGUJ SIĘ</button>
      <div id="loginBusy" class="spinner hidden">Sprawdzanie...</div>
    </form>
  </div>

  <div id="appCard" class="card hidden">
    <div class="top">
      <div><strong>STATUS AUTA</strong><div class="user" id="who"></div></div>
      <button class="secondary" id="logoutBtn">Wyloguj</button>
    </div>
    <div id="appMsg"></div>

    <div class="field">
      <label for="registration">Numer rejestracyjny</label>
      <div class="searchbox">
        <input id="registration" placeholder="Wpisz lub wybierz rejestrację..." autocomplete="off">
        <div id="suggestions" class="suggestions hidden"></div>
      </div>
      <div id="selected" class="selected hidden"></div>
    </div>

    <div class="field">
      <label>Zdjęcia stanu auta</label>
      <label class="upload">
        <input id="photos" type="file" accept="image/*" multiple capture="environment">
        <strong>📷 DODAJ ZDJĘCIA</strong><br>
        <span style="color:#687386;font-size:13px">maksymalnie 10</span>
      </label>
      <div id="preview" class="preview"></div>
      <div id="count" class="count">0 / 10 zdjęć</div>
    </div>

    <div class="field">
      <label for="notes">Uwagi</label>
      <textarea id="notes" placeholder="Wpisz uwagi dotyczące auta..."></textarea>
    </div>

    <button class="primary" id="saveBtn">ZAPISZ STATUS AUTA</button>
    <div id="saveBusy" class="spinner hidden">Zapisywanie zdjęć i danych...</div>
  </div>
</div>

<iframe id="bridge" class="bridge" title="backend"></iframe>

<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzPRYSehqBdn57HdMJb3yQa_F3pC8M4tzGH0AnadVGX5RnkVXz2W1SnQOfsoE6oeQFy/exec';
const ALLOWED_ORIGIN = location.origin;
const bridge = document.getElementById('bridge');
let bridgeReady = false, requestSeq = 0, pending = new Map();
let token = sessionStorage.getItem('statusAutaToken') || '';
let employee = sessionStorage.getItem('statusAutaUser') || '';
let registrations = [], selectedRegistration = '', files = [];

function callBackend(action, payload={}) {
  return new Promise((resolve,reject)=>{
    const id = 'r' + (++requestSeq);
    pending.set(id,{resolve,reject});
    bridge.contentWindow.postMessage({type:'STATUS_AUTA_REQUEST',id,action,payload}, ALLOWED_ORIGIN === 'null' ? '*' : ALLOWED_ORIGIN);
    setTimeout(()=>{ if(pending.has(id)){pending.delete(id);reject(new Error('Przekroczono czas oczekiwania.'));}}, 30000);
  });
}
window.addEventListener('message', e=>{
  if(e.source !== bridge.contentWindow) return;
  if(e.data?.type === 'STATUS_AUTA_READY'){bridgeReady=true; return;}
  if(e.data?.type !== 'STATUS_AUTA_RESPONSE') return;
  const p=pending.get(e.data.id); if(!p)return; pending.delete(e.data.id);
  e.data.ok ? p.resolve(e.data.result) : p.reject(new Error(e.data.error || 'Błąd serwera'));
});
bridge.src = APPS_SCRIPT_URL;

const $=id=>document.getElementById(id);
function msg(el,text,ok=false){el.innerHTML=text?'<div class="msg '+(ok?'ok':'err')+'">'+escapeHtml(text)+'</div>':''}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

async function init(){
  if(!token)return;
  try{
    const r=await callBackend('session',{token});
    if(!r.valid){logout();return}
    employee=r.login; sessionStorage.setItem('statusAutaUser',employee); showApp();
    registrations=await callBackend('registrations',{token});
  }catch(e){logout()}
}
function showApp(){$('loginCard').classList.add('hidden');$('appCard').classList.remove('hidden');$('who').textContent='Zalogowano: '+employee}
function logout(){token='';employee='';sessionStorage.removeItem('statusAutaToken');sessionStorage.removeItem('statusAutaUser');$('appCard').classList.add('hidden');$('loginCard').classList.remove('hidden');$('password').value='';}
$('logoutBtn').onclick=logout;

$('loginForm').onsubmit=async e=>{
 e.preventDefault(); msg($('loginMsg'),''); $('loginBtn').disabled=true;$('loginBusy').classList.remove('hidden');
 try{
   const r=await callBackend('login',{login:$('login').value.trim(),password:$('password').value});
   token=r.token; employee=r.login; sessionStorage.setItem('statusAutaToken',token);sessionStorage.setItem('statusAutaUser',employee);
   registrations=await callBackend('registrations',{token}); showApp();
 }catch(err){msg($('loginMsg'),err.message)} finally{$('loginBtn').disabled=false;$('loginBusy').classList.add('hidden')}
};

$('registration').oninput=()=>{
 const q=$('registration').value.trim().toLowerCase(); selectedRegistration=''; $('selected').classList.add('hidden');
 if(!q){$('suggestions').classList.add('hidden');return}
 const found=registrations.filter(x=>x.toLowerCase().includes(q)).slice(0,20);
 $('suggestions').innerHTML='';
 found.forEach(reg=>{const d=document.createElement('div');d.className='suggestion';d.textContent=reg;d.onclick=()=>{selectedRegistration=reg;$('registration').value=reg;$('selected').textContent='✓ '+reg;$('selected').classList.remove('hidden');$('suggestions').classList.add('hidden')};$('suggestions').appendChild(d)});
 $('suggestions').classList.toggle('hidden',found.length===0);
};

$('photos').onchange=e=>{
 const incoming=[...e.target.files].filter(f=>f.type.startsWith('image/'));
 if(files.length+incoming.length>10){msg($('appMsg'),'Możesz dodać maksymalnie 10 zdjęć.');return}
 files.push(...incoming);render();e.target.value='';
};
function render(){
 $('preview').innerHTML='';
 files.forEach((f,i)=>{const d=document.createElement('div');d.className='pic';const im=document.createElement('img');im.src=URL.createObjectURL(f);const b=document.createElement('button');b.className='x';b.textContent='×';b.onclick=()=>{files.splice(i,1);render()};d.append(im,b);$('preview').append(d)});
 $('count').textContent=files.length+' / 10 zdjęć';
}
function resizeImage(file,max=1600,quality=.78){
 return new Promise((resolve,reject)=>{
  const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{
   let w=img.naturalWidth,h=img.naturalHeight,scale=Math.min(1,max/Math.max(w,h));w=Math.round(w*scale);h=Math.round(h*scale);
   const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(url);
   c.toBlob(blob=>{if(!blob)return reject(new Error('Nie udało się skompresować zdjęcia'));const r=new FileReader();r.onload=()=>resolve({name:file.name.replace(/\.[^.]+$/i,'.jpg'),mimeType:'image/jpeg',data:r.result.split(',')[1]});r.onerror=reject;r.readAsDataURL(blob)},'image/jpeg',quality);
  };img.onerror=reject;img.src=url;
 });
}
$('saveBtn').onclick=async()=>{
 msg($('appMsg'),'');const reg=selectedRegistration||$('registration').value.trim();
 if(!reg||!registrations.some(x=>x.toLowerCase()===reg.toLowerCase())){msg($('appMsg'),'Wybierz samochód z listy.');return}
 $('saveBtn').disabled=true;$('saveBusy').classList.remove('hidden');
 try{
   const photos=[];for(const f of files)photos.push(await resizeImage(f));
   const r=await callBackend('save',{token,registration:reg,notes:$('notes').value.trim(),photos});
   msg($('appMsg'),'Zapisano status auta. Zdjęć: '+r.photoCount,true);
   $('registration').value='';$('selected').classList.add('hidden');$('notes').value='';files=[];render();
 }catch(e){msg($('appMsg'),e.message)}finally{$('saveBtn').disabled=false;$('saveBusy').classList.add('hidden')}
};
init();
</script>
</body>
</html>
