}

}

label{

.field{

input,

  outline:0;

textarea{

.secondary{

.hidden{

.msg{
  padding:12px;

  margin-bottom:16px;

}

.err{
  background:#feeceb;
  color:var(--danger);
}

.ok{

  color:var(--ok);
}

.searchbox{
  position:relative;
}

.suggestions{
  position:absolute;
  z-index:5;
  left:0;

  background:white;
  border:1px solid #ddd;
  max-height:230px;
  overflow:auto;

.suggestion{
  padding:12px;

  cursor:pointer;
}

.suggestion:hover{

}

.selected{
  margin-top:9px;
  padding:11px;
  border-radius:10px;
  background:#e8f0fe;
  color:#174ea6;
  font-weight:700;
}

.upload{
  border:2px dashed #c7ccd4;
  border-radius:12px;
  padding:20px;
  text-align:center;
  background:#fafbfc;
  cursor:pointer;
}

.upload input{
  display:none;
}

.count{
  text-align:right;
  color:var(--muted);
  font-size:13px;
  margin-top:7px;
}

.preview{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
  margin-top:12px;
}

.pic{
  position:relative;
  aspect-ratio:1;
  overflow:hidden;
  border-radius:10px;
  background:#eee;
}

.pic img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.x{
  position:absolute;
  right:5px;
  top:5px;
  width:28px;
  height:28px;
  padding:0;
  border-radius:50%;
  background:#000b;
  color:#fff;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.user{
  color:var(--muted);
  font-size:14px;
}

.spinner{
  text-align:center;
  color:var(--muted);
  margin-top:12px;
}

.bridge{
  position:absolute;
  width:1px;
  height:1px;
  left:-10000px;
  top:-10000px;
}

@media(max-width:520px){

  .card{
    padding:18px;
  }

  .preview{
    grid-template-columns:repeat(2,1fr);
  }

}

<!-- =====================================================
     IFRAME DO APPS SCRIPT
===================================================== -->

<iframe
  id="bridge"
  class="bridge"
  title="backend"
></iframe>


<script>


const APPS_SCRIPT_URL =
'https://script.google.com/macros/s/AKfycbzBOKRxCO2uUM8TTgQPSiu6CbMoFWR91EnkNMDv3TkN0bcqD77Mfhe1P2KzopMwQOR9/exec';

const GITHUB_ORIGIN =
'https://m4ttwork.github.io';

const bridge =
document.getElementById('bridge');


let bridgeReady = false;

let bridgeReadyPromise;

let bridgeReadyResolve;

let requestSeq = 0;

let pending = new Map();


let token =
sessionStorage.getItem(
  'statusAutaToken'
) || '';


let employee =
sessionStorage.getItem(
  'statusAutaUser'
) || '';


let registrations = [];

let selectedRegistration = '';

let files = [];


/*
 * Tworzymy Promise oczekujący
 * na załadowanie Bridge.
 */

bridgeReadyPromise =
new Promise(function(resolve) {

  bridgeReadyResolve = resolve;

});


/*
 * Odbieramy wiadomości z Apps Script.
 */

window.addEventListener(
  'message',
  function(event) {

    /*
     * Wiadomość musi pochodzić
     * z Apps Script.
     *
     * Nie sprawdzamy tutaj sztywno
     * script.google.com, ponieważ Apps Script
     * może przekierować iframe na
     * script.googleusercontent.com.
     */

    const data =
      event.data;


    if (!data) {
      return;
    }


    /*
     * Bridge gotowy.
     */

    if (
      data.type ===
      'STATUS_AUTA_READY'
    ) {

      bridgeReady = true;

      if (bridgeReadyResolve) {
        bridgeReadyResolve();
      }

      console.log(
        'STATUS AUTA: Bridge gotowy'
      );

      const status = document.getElementById('connectionStatus');

      if (status) {
        status.textContent =
          'Bridge gotowy — kanał komunikacji działa.';
      }

      return;

    }


    /*
     * Odpowiedź z backendu.
     */

    if (
      data.type !==
      'STATUS_AUTA_RESPONSE'
    ) {

      return;

    }


    const request =
      pending.get(
        data.id
      );


    if (!request) {
      return;
    }


    pending.delete(
      data.id
    );


    if (data.ok) {

      request.resolve(
        data.result
      );

    } else {

      request.reject(
        new Error(
          data.error ||
          'Błąd Apps Script.'
        )
      );

    }

  }
);


/*
 * Ładujemy Apps Script.
 */

bridge.onload =
function() {

  console.log(
    'STATUS AUTA: iframe Apps Script załadowany'
  );

  const status = document.getElementById('connectionStatus');

  if (status) {
    status.textContent =
      'Iframe Apps Script załadowany. Czekam na Bridge...';
  }

};

bridge.onerror =
function() {

  console.error(
    'STATUS AUTA: błąd ładowania iframe Apps Script'
  );

  const status = document.getElementById('connectionStatus');

  if (status) {
    status.textContent =
      'BŁĄD: nie udało się załadować Apps Script.';
  }

};


/*
 * Ustawiamy iframe.
 */

bridge.src =
APPS_SCRIPT_URL;


/*
 * Główna funkcja komunikacji.
 */

async function callBackend(
  action,
  payload = {}
) {

  /*
   * Czekamy maksymalnie 15 sekund
   * na załadowanie Bridge.
   */

  if (!bridgeReady) {

    await Promise.race([

      bridgeReadyPromise,

      new Promise(
        function(_, reject) {

          setTimeout(
            function() {

              reject(
                new Error(
                  'Apps Script nie uruchomił kanału komunikacji.'
                )
              );

            },
            15000
          );

        }
      )

    ]);

  }


  return new Promise(
    function(resolve, reject) {

      const id =
        'r' +
        (++requestSeq);


      pending.set(
        id,
        {
          resolve: resolve,
          reject: reject
        }
      );


      console.log(
        'STATUS AUTA → Apps Script:',
        action
      );


      /*
       * Wysyłamy żądanie do Bridge.
       */

      bridge.contentWindow.postMessage(
        {
          type:
            'STATUS_AUTA_REQUEST',

          id:
            id,

          action:
            action,

          payload:
            payload
        },
        '*'
      );


      /*
       * Timeout żądania.
       */

      setTimeout(
        function() {

          if (
            pending.has(id)
          ) {

            pending.delete(id);

            reject(
              new Error(
                'Apps Script nie odpowiedział na żądanie: ' +
                action
              )
            );

          }

        },
        30000
      );

    }
  );

}


/************************************************************
 * POMOCNICZE
 ************************************************************/

async function testConnection() {

  const status = document.getElementById('connectionStatus');

  if (status) {
    status.textContent = 'Testuję połączenie z Apps Script...';
  }

  try {

    const result = await callBackend('ping', {});

    console.log('STATUS AUTA PING:', result);

    if (status) {
      status.textContent =
        'POŁĄCZENIE DZIAŁA: ' +
        (result && result.message
          ? result.message
          : 'Apps Script odpowiedział poprawnie.');
    }

  } catch (error) {

    console.error(
      'STATUS AUTA: test połączenia nieudany',
      error
    );

    if (status) {
      status.textContent =
        'BŁĄD POŁĄCZENIA: ' + error.message;
    }
  }
}


document.getElementById('testConnectionBtn').onclick =
  testConnection;


const $ =
  id =>
    document.getElementById(id);


function msg(
  element,
  text,
  ok = false
){

  element.innerHTML =
    text
      ? '<div class="msg ' +
        (ok ? 'ok' : 'err') +
        '">' +
        escapeHtml(text) +
        '</div>'
      : '';

}


function escapeHtml(value){

  return String(value)
    .replace(
      /[&<>"']/g,
      function(m){

        return {

          '&':'&amp;',
          '<':'&lt;',
          '>':'&gt;',
          '"':'&quot;',
          "'":'&#39;'

        }[m];

      }
    );

}


/************************************************************
 * LOGOWANIE
 ************************************************************/

$('loginForm').onsubmit =
async function(event){

  event.preventDefault();


  msg(
    $('loginMsg'),
    ''
  );


  $('loginBtn')
    .disabled = true;


  $('loginBusy')
    .classList
    .remove('hidden');


  try{

    const result =
      await callBackend(
        'login',
        {

          login:
            $('login')
              .value
              .trim(),

          password:
            $('password')
              .value

        }
      );


    if(
      !result ||
      !result.success
    ){

      throw new Error(
        result?.error ||
        'Nieprawidłowy login lub hasło.'
      );

    }


    token =
      result.token;


    employee =
      result.login;


    sessionStorage.setItem(
      'statusAutaToken',
      token
    );


    sessionStorage.setItem(
      'statusAutaUser',
      employee
    );


    /*
     * Pobieramy samochody.
     */

    const carResult =
      await callBackend(
        'getRegistrations',
        {
          token:token
        }
      );


    if(
      !carResult ||
      !carResult.success
    ){

      throw new Error(
        carResult?.error ||
        'Nie udało się pobrać samochodów.'
      );

    }


    registrations =
      carResult.registrations ||
      [];


    showApp();


  }catch(error){

    msg(
      $('loginMsg'),
      error.message
    );


  }finally{

    $('loginBtn')
      .disabled = false;


    $('loginBusy')
      .classList
      .add('hidden');

  }

};


/************************************************************
 * POKAŻ PANEL
 ************************************************************/

function showApp(){

  $('loginCard')
    .classList
    .add('hidden');


  $('appCard')
    .classList
    .remove('hidden');


  $('who')
    .textContent =
      'Zalogowano: ' +
      employee;

}


/************************************************************
 * WYLOGOWANIE
 ************************************************************/

$('logoutBtn').onclick =
async function(){

  try{

    if(token){

      await callBackend(
        'logout',
        {
          token:token
        }
      );

    }

  }catch(error){

    console.log(
      'Logout error:',
      error
    );

  }


  token = '';

  employee = '';

  registrations = [];

  selectedRegistration = '';

  files = [];


  sessionStorage.removeItem(
    'statusAutaToken'
  );

  sessionStorage.removeItem(
    'statusAutaUser'
  );


  $('appCard')
    .classList
    .add('hidden');


  $('loginCard')
    .classList
    .remove('hidden');


  $('password').value = '';

  render();

};


/************************************************************
 * WYSZUKIWANIE SAMOCHODU
 ************************************************************/

$('registration').oninput =
function(){

  const query =
    $('registration')
      .value
      .trim()
      .toLowerCase();


  selectedRegistration = '';


  $('selected')
    .classList
    .add('hidden');


  if(!query){

    $('suggestions')
      .classList
      .add('hidden');

    return;

  }


  const found =
    registrations
      .filter(
        function(reg){

          return reg
            .toLowerCase()
            .includes(query);

        }
      )
      .slice(
        0,
        20
      );


  $('suggestions')
    .innerHTML = '';


  found.forEach(
    function(reg){

      const div =
        document.createElement(
          'div'
        );


      div.className =
        'suggestion';


      div.textContent =
        reg;


      div.onclick =
        function(){

          selectedRegistration =
            reg;


          $('registration')
            .value =
              reg;


          $('selected')
            .textContent =
              '✓ ' + reg;


          $('selected')
            .classList
            .remove('hidden');


          $('suggestions')
            .classList
            .add('hidden');

        };


      $('suggestions')
        .appendChild(div);

    }
  );


  $('suggestions')
    .classList
    .toggle(
      'hidden',
      found.length === 0
    );

};


/************************************************************
 * ZDJĘCIA
 ************************************************************/

$('photos').onchange =
function(event){

  const incoming =
    [
      ...event.target.files
    ]
    .filter(
      file =>
        file.type.startsWith(
          'image/'
        )
    );


  if(
    files.length +
    incoming.length >
    10
  ){

    msg(
      $('appMsg'),
      'Możesz dodać maksymalnie 10 zdjęć.'
    );

    return;

  }


  files.push(
    ...incoming
  );


  render();


  event.target.value = '';

};


/************************************************************
 * PODGLĄD ZDJĘĆ
 ************************************************************/

function render(){

  $('preview')
    .innerHTML = '';


  files.forEach(
    function(file,index){

      const div =
        document.createElement(
          'div'
        );


      div.className =
        'pic';


      const img =
        document.createElement(
          'img'
        );


      img.src =
        URL.createObjectURL(
          file
        );


      const button =
        document.createElement(
          'button'
        );


      button.className =
        'x';


      button.textContent =
        '×';


      button.onclick =
        function(){

          files.splice(
            index,
            1
          );


          render();

        };


      div.appendChild(img);

      div.appendChild(button);

      $('preview')
        .appendChild(div);

    }
  );


  $('count')
    .textContent =
      files.length +
      ' / 10 zdjęć';

}


/************************************************************
 * KOMPRESJA ZDJĘCIA
 ************************************************************/

function resizeImage(
  file,
  max = 1600,
  quality = 0.78
){

  return new Promise(
    function(resolve,reject){

      const img =
        new Image();


      const url =
        URL.createObjectURL(
          file
        );


      img.onload =
        function(){

          let width =
            img.naturalWidth;


          let height =
            img.naturalHeight;


          const scale =
            Math.min(
              1,
              max /
              Math.max(
                width,
                height
              )
            );


          width =
            Math.round(
              width * scale
            );


          height =
            Math.round(
              height * scale
            );


          const canvas =
            document.createElement(
              'canvas'
            );


          canvas.width =
            width;


          canvas.height =
            height;


          const context =
            canvas.getContext(
              '2d'
            );


          context.drawImage(
            img,
            0,
            0,
            width,
            height
          );


          URL.revokeObjectURL(
            url
          );


          canvas.toBlob(
            function(blob){

              if(!blob){

                reject(
                  new Error(
                    'Nie udało się skompresować zdjęcia.'
                  )
                );

                return;

              }


              const reader =
                new FileReader();


              reader.onload =
                function(){

                  resolve({

                    name:
                      file.name
                        .replace(
                          /\.[^.]+$/i,
                          '.jpg'
                        ),

                    mimeType:
                      'image/jpeg',

                    data:
                      reader.result
                        .split(',')[1]

                  });

                };


              reader.onerror =
                reject;


              reader.readAsDataURL(
                blob
              );

            },
            'image/jpeg',
            quality
          );

        };


      img.onerror =
        reject;


      img.src =
        url;

    }
  );

}


/************************************************************
 * ZAPIS STATUSU
 ************************************************************/

$('saveBtn').onclick =
async function(){

  msg(
    $('appMsg'),
    ''
  );


  const registration =
    selectedRegistration ||
    $('registration')
      .value
      .trim();


  if(
    !registration ||
    !registrations.some(
      function(x){

        return x.toLowerCase() ===
          registration.toLowerCase();

      }
    )
  ){

    msg(
      $('appMsg'),
      'Wybierz samochód z listy.'
    );

    return;

  }


  $('saveBtn')
    .disabled = true;


  $('saveBusy')
    .classList
    .remove('hidden');


  try{

    const photos = [];


    for(
      const file of files
    ){

      photos.push(
        await resizeImage(
          file
        )
      );

    }


    const result =
      await callBackend(
        'saveReport',
        {

          token:
            token,

          registration:
            registration,

          notes:
            $('notes')
              .value
              .trim(),

          photos:
            photos

        }
      );


    if(
      !result ||
      !result.success
    ){

      throw new Error(
        result?.error ||
        'Nie udało się zapisać danych.'
      );

    }


    msg(
      $('appMsg'),
      'Status auta został zapisany. Zdjęć: ' +
      result.photoCount,
      true
    );


    $('registration')
      .value = '';


    $('selected')
      .classList
      .add('hidden');


    $('notes')
      .value = '';


    selectedRegistration = '';

    files = [];


    render();


  }catch(error){

    msg(
      $('appMsg'),
      error.message
    );


  }finally{

    $('saveBtn')
      .disabled = false;


    $('saveBusy')
      .classList
      .add('hidden');

  }

};


/************************************************************
 * START
 ************************************************************/

setTimeout(function() {
  testConnection();
}, 700);


async function init(){

  /*
   * Jeżeli nie ma zapisanej sesji,
   * zostajemy na logowaniu.
   */

  if(!token){

    return;

  }


  try{

    const result =
      await callBackend(
        'checkSession',
        {
          token:token
        }
      );


    if(
      !result ||
      !result.valid
    ){

      throw new Error(
        'Sesja wygasła.'
      );

    }


    employee =
      result.login;


    const carResult =
      await callBackend(
        'getRegistrations',
        {
          token:token
        }
      );


    if(
      !carResult ||
      !carResult.success
    ){

      throw new Error(
        carResult?.error ||
        'Nie udało się pobrać samochodów.'
      );

    }


    registrations =
      carResult.registrations ||
      [];


    showApp();


  }catch(error){

    sessionStorage.removeItem(
      'statusAutaToken'
    );

    sessionStorage.removeItem(
      'statusAutaUser'
    );


    token = '';

    employee = '';

  }

}


init();

</script>

</body>

</html>
